name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check taintline/ tests/
      - name: Test
        run: pytest --cov=taintline --cov-report=term-missing
      - name: Detection eval (recall / precision gate)
        run: taintline evaluate

  self-scan:
    # Dogfood: generate a trace with known attacks and assert taintline flags it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Generate attack corpus
        run: taintline simulate --benign 10 --out trace.jsonl
      - name: Analyze and emit SARIF
        run: taintline analyze trace.jsonl --out report/
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report/trace.sarif
        continue-on-error: true
      - name: Fail if a critical flow is present (expected on this corpus)
        run: |
          taintline analyze trace.jsonl --fail-on critical --quiet && echo "no critical (unexpected)" && exit 1 || echo "critical findings gated as expected"
