<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <style>
    .box{fill:#0f182d;stroke:#1c2a48;stroke-width:1.5}
    .t{fill:#e9eef9;font-size:15px;font-weight:700}
    .s{fill:#8fa0c2;font-size:12px}
    .path{stroke:#1c2a48;stroke-width:2;fill:none}
    .lbl{fill:#60a5fa;font-size:13px;font-weight:700;opacity:0}
    .l1{animation:l1 9s infinite}.l2{animation:l2 9s infinite}.l3{animation:l3 9s infinite}
    @keyframes l1{0%,4%{opacity:0}9%,30%{opacity:1}35%,100%{opacity:0}}
    @keyframes l2{0%,34%{opacity:0}39%,60%{opacity:1}65%,100%{opacity:0}}
    @keyframes l3{0%,64%{opacity:0}69%,95%{opacity:1}100%{opacity:0}}
    .dot{fill:#60a5fa;filter:url(#g)}
    .move{animation:move 9s infinite;opacity:0}
    @keyframes move{
      0%,5%{opacity:0;transform:translate(0,0)}
      9%{opacity:1;transform:translate(0,0)}
      33%{transform:translate(235px,0);opacity:1}
      38%{transform:translate(235px,0);opacity:1}
      62%{transform:translate(470px,0);opacity:1}
      66%{transform:translate(470px,0);opacity:1}
      70%{opacity:0;transform:translate(470px,0)}
      100%{opacity:0}}
    .trail{stroke:#3b82f6;stroke-width:3;fill:none;stroke-dasharray:480;stroke-dashoffset:480;animation:trail 9s infinite;opacity:.9}
    @keyframes trail{0%,8%{stroke-dashoffset:480}62%{stroke-dashoffset:0}66%{stroke-dashoffset:0}70%,100%{stroke-dashoffset:480}}
    .check{opacity:0;transform-box:fill-box;transform-origin:center;animation:check 9s infinite}
    @keyframes check{0%,62%{opacity:0;transform:scale(.7)}67%{opacity:1;transform:scale(1.12)}72%,95%{opacity:1;transform:scale(1)}100%{opacity:0}}
    .halo{fill:none;stroke:#22d3ee;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 9s infinite}
    @keyframes halo{0%,64%{opacity:0;transform:scale(.6)}68%{opacity:.9;transform:scale(1)}90%{opacity:0;transform:scale(1.9)}100%{opacity:0}}
    .agentpulse{opacity:0;animation:ap 9s infinite}
    @keyframes ap{0%,34%{opacity:0}40%,58%{opacity:.6}64%,100%{opacity:0}}
  </style>
  <defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>

  <!-- connection line -->
  <path class="path" d="M 215 150 H 685"/>
  <path class="trail" d="M 215 150 H 685"/>

  <!-- node 1: untrusted input -->
  <rect class="box" x="60" y="105" width="155" height="90" rx="14"/>
  <text class="t" x="137" y="142" text-anchor="middle">Untrusted input</text>
  <text class="s" x="137" y="164" text-anchor="middle">web page · email · file</text>
  <text class="s" x="137" y="181" text-anchor="middle">tool result · memory</text>

  <!-- node 2: the agent -->
  <rect class="agentpulse" x="378" y="103" width="159" height="94" rx="16" fill="#3b82f6"/>
  <rect class="box" x="380" y="105" width="155" height="90" rx="14"/>
  <text class="t" x="457" y="142" text-anchor="middle">AI agent</text>
  <text class="s" x="457" y="164" text-anchor="middle">reads it · reasons</text>
  <text class="s" x="457" y="181" text-anchor="middle">decides what to do</text>

  <!-- node 3: sensitive action -->
  <rect class="box" x="685" y="105" width="155" height="90" rx="14"/>
  <text class="t" x="762" y="142" text-anchor="middle">Sensitive action</text>
  <text class="s" x="762" y="164" text-anchor="middle">send · run · write</text>
  <text class="s" x="762" y="181" text-anchor="middle">cloud · payments</text>

  <!-- taint packet moving along the line -->
  <g class="move"><circle class="dot" cx="215" cy="150" r="8"/></g>

  <!-- taintline checkpoint at the action -->
  <g class="check">
    <circle class="halo" cx="685" cy="150" r="22"/>
    <circle cx="685" cy="150" r="20" fill="#0b1222" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="685" y="156" text-anchor="middle" font-size="17" fill="#22d3ee" font-weight="800">✓</text>
  </g>

  <!-- step labels (narration) -->
  <text class="lbl l1" x="137" y="70" text-anchor="middle">1 · something untrusted arrives</text>
  <text class="lbl l2" x="457" y="70" text-anchor="middle">2 · taintline follows it through the agent</text>
  <text class="lbl l3" x="762" y="70" text-anchor="middle">3 · checked before anything sensitive runs</text>

  <text class="s" x="450" y="262" text-anchor="middle">The blue trail is the taint. taintline tracks where it came from, where it went, and stops it at the door if it shouldn't pass.</text>
</svg>
