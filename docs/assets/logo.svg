<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="taintline logo: a broken AI agent on a tainted event line">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- plate -->
  <rect width="256" height="256" rx="56" fill="#03060c"/>

  <!-- antenna, bent and unlit -->
  <path d="M128 70 V54 L140 40" fill="none" stroke="#5aa9ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="146" cy="34" r="8" fill="none" stroke="#5aa9ff" stroke-width="6"/>

  <!-- head -->
  <rect x="56" y="70" width="144" height="118" rx="26" fill="#0a1526" stroke="#5aa9ff" stroke-width="8" filter="url(#glow)"/>

  <!-- crack -->
  <path d="M166 70 L156 90 L172 102 L160 118" fill="none" stroke="#5aa9ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dead eyes -->
  <g stroke="#ff6b6b" stroke-width="11" stroke-linecap="round" filter="url(#glow)">
    <path d="M86 108 L112 134 M112 108 L86 134"/>
    <path d="M144 108 L170 134 M170 108 L144 134"/>
  </g>

  <!-- mouth -->
  <path d="M100 162 H156" fill="none" stroke="#5aa9ff" stroke-width="7" stroke-linecap="round"/>

  <!-- the taint line: a trail of events, tainted span in red -->
  <path d="M22 220 H234" fill="none" stroke="#2a5c9e" stroke-width="7" stroke-linecap="round"/>
  <path d="M92 220 H164" fill="none" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <g fill="#5aa9ff">
    <circle cx="40" cy="220" r="8"/>
    <circle cx="216" cy="220" r="8"/>
  </g>
  <g fill="#ff6b6b" filter="url(#glow)">
    <circle cx="92" cy="220" r="8"/>
    <circle cx="164" cy="220" r="8"/>
  </g>
</svg>
