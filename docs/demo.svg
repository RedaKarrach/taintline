<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15">
  <style>
    .win { fill: #12141c; }
    .bar { fill: #1c1f2a; }
    .fg { fill: #e6e8ec; }
    .muted { fill: #9aa0a6; }
    .prompt { fill: #2a9d8f; }
    .cmd { fill: #e6e8ec; }
    .crit { fill: #ff6b6b; font-weight: bold; }
    .high { fill: #e0a21e; font-weight: bold; }
    .accent { fill: #ff6b6b; font-weight: bold; }
    .ok { fill: #2a9d8f; }
    .ln { opacity: 0; animation: reveal 13s infinite; }
    @keyframes reveal { 0%,4% {opacity:0} 8%,96% {opacity:1} 100% {opacity:0} }
    .l1{animation-delay:.2s}.l2{animation-delay:1.0s}.l3{animation-delay:1.8s}
    .l4{animation-delay:2.4s}.l5{animation-delay:2.9s}.l6{animation-delay:3.4s}
    .l7{animation-delay:4.2s}.l8{animation-delay:4.8s}.l9{animation-delay:5.3s}
    .cur { animation: blink 1s steps(1) infinite; } @keyframes blink {50%{opacity:0}}
  </style>

  <rect class="win" x="0" y="0" width="820" height="440" rx="10"/>
  <rect class="bar" x="0" y="0" width="820" height="34" rx="10"/>
  <rect class="bar" x="0" y="20" width="820" height="14"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" class="muted" font-size="13">taintline — investigate a hijacked agent</text>

  <g transform="translate(22,64)">
    <text class="ln l1"><tspan class="prompt">$ </tspan><tspan class="cmd">taintline analyze demo.jsonl</tspan></text>

    <text y="40" class="ln l2 muted">taintline findings (3)</text>
    <text y="68" class="ln l3"><tspan class="crit">CRITICAL </tspan><tspan class="muted">TL-EXF-001  </tspan><tspan class="fg">Credential material flows into an outbound call</tspan></text>
    <text y="92" class="ln l4"><tspan class="crit">CRITICAL </tspan><tspan class="muted">TL-INJ-001  </tspan><tspan class="fg">Indirect prompt injection reaches an exfil sink</tspan></text>
    <text y="116" class="ln l5"><tspan class="high">HIGH     </tspan><tspan class="muted">TL-SEQ-001  </tspan><tspan class="fg">Credential read, then an unauthorized destination</tspan></text>

    <text y="164" class="ln l6 accent">BLAST RADIUS: CRITICAL</text>
    <text y="192" class="ln l7"><tspan class="muted">  rotate: </tspan><tspan class="fg">aws_access_key_id, aws_secret_access_key</tspan></text>
    <text y="216" class="ln l8"><tspan class="muted">  block:  </tspan><tspan class="fg">evil-collector.test</tspan></text>

    <text y="260" class="ln l9"><tspan class="prompt">$ </tspan><tspan class="ok">guarded in ~1.5ms — the runtime guard blocks this live </tspan><tspan class="fg cur">▋</tspan></text>
  </g>
</svg>
