<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
  <style>
    .fg{fill:#e9eef9}.muted{fill:#8fa0c2}.prompt{fill:#22d3ee}
    .crit{fill:#fb7185;font-weight:bold}.high{fill:#fbbf24;font-weight:bold}.ok{fill:#34d399}
    .ln{opacity:0;animation:reveal 12s infinite}
    @keyframes reveal{0%,4%{opacity:0}8%,96%{opacity:1}100%{opacity:0}}
    .l1{animation-delay:.2s}.l2{animation-delay:1.0s}.l3{animation-delay:1.7s}.l4{animation-delay:2.2s}
    .l5{animation-delay:2.7s}.l6{animation-delay:3.5s}.l7{animation-delay:4.0s}.l8{animation-delay:4.5s}.l9{animation-delay:5.3s}
    .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  </style>
  <rect x="0" y="0" width="820" height="400" rx="12" fill="#0b1222"/>
  <rect x="0" y="0" width="820" height="34" rx="12" fill="#0f182d"/>
  <rect x="0" y="20" width="820" height="14" fill="#0f182d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" class="muted" font-size="13">taintline — investigating a hijacked agent</text>
  <g transform="translate(22,64)">
    <text class="ln l1"><tspan class="prompt">$ </tspan><tspan class="fg">taintline analyze demo.jsonl</tspan></text>
    <text y="40" class="ln l2 muted">taintline findings (3)</text>
    <text y="68" class="ln l3"><tspan class="crit">CRITICAL </tspan><tspan class="muted">TL-EXF-001  </tspan><tspan class="fg">Credential material flows into an outbound call</tspan></text>
    <text y="92" class="ln l4"><tspan class="crit">CRITICAL </tspan><tspan class="muted">TL-INJ-001  </tspan><tspan class="fg">Indirect prompt injection reaches an exfil sink</tspan></text>
    <text y="116" class="ln l5"><tspan class="high">HIGH     </tspan><tspan class="muted">TL-SEQ-001  </tspan><tspan class="fg">Credential read, then an unauthorized destination</tspan></text>
    <text y="164" class="ln l6 crit">BLAST RADIUS: CRITICAL</text>
    <text y="192" class="ln l7"><tspan class="muted">  rotate: </tspan><tspan class="fg">aws_access_key_id, aws_secret_access_key</tspan></text>
    <text y="216" class="ln l8"><tspan class="muted">  block:  </tspan><tspan class="fg">evil-collector.test</tspan></text>
    <text y="260" class="ln l9"><tspan class="prompt">$ </tspan><tspan class="ok">the guard would have blocked this live, in ~1.5 ms </tspan><tspan class="fg cur">▋</tspan></text>
  </g>
</svg>
